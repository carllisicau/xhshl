<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ebdff5">
  <title>For SHL</title>
  <style>
    @font-face {
      font-family: "Cormorant Garamond";
      src: url("./assets/cormorant-normal.woff2") format("woff2");
      font-style: normal;
      font-weight: 300 700;
      font-display: swap;
    }

    @font-face {
      font-family: "Cormorant Garamond";
      src: url("./assets/cormorant-italic.woff2") format("woff2");
      font-style: italic;
      font-weight: 300 700;
      font-display: swap;
    }

    :root {
      color-scheme: light;
      --ink: #392849;
      --violet: #5c4272;
      --sky: #ebdff5;
      --serif: "Cormorant Garamond", Georgia, serif;
      color: var(--ink);
      background: var(--sky);
      font-family: system-ui, "Microsoft YaHei", sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    ::selection {
      color: var(--ink);
      background: #f2cce8;
    }

    .scene {
      position: relative;
      isolation: isolate;
      display: grid;
      justify-items: center;
      align-content: start;
      min-block-size: max(33rem, 100svh);
      padding: clamp(4.5rem, 19svh, 12rem) 1.25rem 4rem;
      overflow: hidden;
      background: linear-gradient(155deg, #d9c8ef, var(--sky) 45%, #f5cfdf);
    }

    .scene__sky {
      position: absolute;
      z-index: -2;
      inset: 0;
      pointer-events: none;
    }

    .scene__sky img {
      display: block;
      inline-size: 100%;
      block-size: 100%;
      object-fit: cover;
      object-position: center 54%;
      transform: scale(1.025);
    }

    .scene::before {
      position: absolute;
      z-index: -1;
      inset: 0;
      background: radial-gradient(ellipse at 50% 36%, rgb(255 246 252 / 38%), transparent 66%);
      pointer-events: none;
      content: "";
    }

    .scene__glow {
      position: absolute;
      z-index: -1;
      inline-size: clamp(8rem, 24vw, 16rem);
      aspect-ratio: 1.4;
      border-radius: 50%;
      opacity: 0;
      background: radial-gradient(ellipse, rgb(255 244 252 / 94%), transparent 68%);
      pointer-events: none;
    }

    .dedication {
      display: grid;
      justify-items: center;
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(5.25rem, 10vw, 9rem);
      font-weight: 600;
      letter-spacing: 0.015em;
      line-height: 0.78;
      text-align: center;
    }

    .dedication__for {
      margin: 0 0 0.19em;
      color: var(--violet);
      font-size: 0.45em;
      font-style: italic;
      font-weight: 500;
      letter-spacing: -0.035em;
      line-height: 0.95;
    }

    .signature {
      margin: clamp(0.85rem, 2.5svh, 1.3rem) 0 0;
      color: var(--violet);
      font-family: var(--serif);
      font-size: clamp(1.6rem, 3.2vw, 2.05rem);
      font-style: italic;
      font-weight: 600;
      line-height: 1;
    }

    .letter {
      margin-block-start: clamp(1.5rem, 4svh, 2.4rem);
      text-align: center;
    }

    .letter__toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      min-block-size: 2.85rem;
      padding: 0.65rem 1.25rem;
      border: 1px solid #856c99;
      border-radius: 999px;
      color: var(--ink);
      background: #faedf8;
      font-size: 0.875rem;
      font-weight: 550;
      letter-spacing: 0.07em;
      cursor: pointer;
      list-style: none;
      transition: background-color 180ms ease, border-color 180ms ease;
    }

    .letter__toggle::-webkit-details-marker {
      display: none;
    }

    .letter__toggle:focus-visible {
      outline: 2px solid var(--violet);
      outline-offset: 4px;
    }

    @media (hover: hover) {
      .letter__toggle:hover {
        border-color: var(--violet);
        background: #fff8fd;
      }
    }

    .letter__caret {
      inline-size: 0.43rem;
      block-size: 0.43rem;
      margin-block-start: -0.2rem;
      border-inline-end: 1px solid currentColor;
      border-block-end: 1px solid currentColor;
      rotate: 45deg;
      transition: rotate 180ms ease;
    }

    .letter__collapse,
    .letter[open] .letter__open {
      display: none;
    }

    .letter[open] .letter__collapse {
      display: inline;
    }

    .letter[open] .letter__caret {
      margin-block-start: 0.2rem;
      rotate: 225deg;
    }

    .letter__body {
      max-inline-size: 25ch;
      margin: 1.15rem auto 0;
      color: var(--ink);
      font-family: "Songti SC", "Noto Serif SC", SimSun, serif;
      font-size: clamp(1rem, 2vw, 1.12rem);
      letter-spacing: 0.06em;
      line-height: 1.85;
      text-wrap: balance;
    }

    @media (max-width: 700px) {
      .scene__sky img {
        object-position: center 60%;
      }

      .dedication {
        letter-spacing: 0;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .scene__sky img {
        animation: drift-in 4.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .letter__body {
        animation: unfold 420ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @keyframes drift-in {
        from { transform: translate3d(0.45%, 0.75%, 0) scale(1.065); }
        to { transform: scale(1.025); }
      }

      @keyframes unfold {
        from { opacity: 0; transform: translateY(0.35rem); }
        to { opacity: 1; transform: translateY(0); }
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .letter__toggle,
      .letter__caret {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="scene">
    <picture class="scene__sky" aria-hidden="true">
      <source media="(max-width: 800px) and (max-aspect-ratio: 1/1)" srcset="./assets/dawn-clouds-portrait.webp">
      <img src="./assets/dawn-clouds.webp" alt="" fetchpriority="high">
    </picture>
    <h1 class="dedication" lang="en"><span class="dedication__for">For</span> SHL</h1>
    <p class="signature" lang="en">always</p>
    <details class="letter">
      <summary class="letter__toggle">
        <span class="letter__open">打开信笺</span>
        <span class="letter__collapse">合上信笺</span>
        <span class="letter__caret" aria-hidden="true"></span>
      </summary>
      <p class="letter__body">有一份心意，<br>从这一刻，到很久以后。</p>
    </details>
    <span class="scene__glow" aria-hidden="true"></span>
  </main>
  <script>
    const scene = document.querySelector(".scene");
    const glow = document.querySelector(".scene__glow");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    let activeGlow;

    scene.addEventListener("click", (event) => {
      if (reducedMotion.matches || event.detail === 0 || event.target.closest(".letter")) {
        return;
      }

      // Reuse the glow so repeated taps stay as light as a single one.
      activeGlow?.cancel();
      const bounds = scene.getBoundingClientRect();
      glow.style.left = (event.clientX - bounds.left) + "px";
      glow.style.top = (event.clientY - bounds.top) + "px";
      activeGlow = glow.animate([
        { transform: "translate(-50%, -50%) scale(0.25)", opacity: 0 },
        { opacity: 0.66, offset: 0.2 },
        { transform: "translate(-50%, -56%) scale(1.45)", opacity: 0 }
      ], { duration: 880, easing: "ease-out" });
    });
  </script>
</body>
</html>
